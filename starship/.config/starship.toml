palette = "noctalia"
format = """$username$hostname$directory$git_branch$git_status$status
$character"""

[line_break]
disabled = false

[character]
success_symbol = "[╰─](bold blue) [❯](bold cyan)"
error_symbol = "[╰─](bold blue) [❯](bold red)"

[directory]
style = "bold blue"
format = "[$path]($style) "
truncation_length = 3

[cmd_duration]
min_time = 500
format = "via [󱎫 $duration](bold yellow) "













